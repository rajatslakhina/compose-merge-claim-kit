<text x="20" y="568" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;rule&#160;broken:&#160;laterFileWins:&#160;wrong&#160;(earlierFileWins).&#160;Where&#160;files&#160;disagree,&#160;the&#160;later&#160;file&#160;wins:&#160;compose&#160;applies&#160;them&#160;in&#160;order.</text>
<text x="20" y="583" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;rule&#160;broken:&#160;otherFilesNeedFile:&#160;wrong&#160;(extraFileAutoLoaded).&#160;By&#160;default&#160;compose&#160;reads&#160;only&#160;the&#160;base&#160;file&#160;and&#160;its&#160;override;&#160;any&#160;other&#160;file&#160;needs&#160;its&#160;own&#160;`-f`.</text>
<text x="20" y="598" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;rule&#160;broken:&#160;pathsFromProjectDirectory:&#160;wrong&#160;(pathsRelativeToOverride).&#160;Relative&#160;paths&#160;in&#160;every&#160;file&#160;are&#160;resolved&#160;from&#160;the&#160;first&#160;file's&#160;directory&#160;(the&#160;project&#160;directory),&#160;not&#160;from&#160;the&#160;file&#160;that&#160;writes</text>
<text x="20" y="613" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;them.</text>
<text x="20" y="628" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="643" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">7.&#160;A&#160;result&#160;that&#160;depends&#160;on&#160;!override</text>
