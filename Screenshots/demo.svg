<text x="20" y="673" fill="#fcd34d" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`web`&#160;publishes&#160;only&#160;port&#160;`8443`:&#160;caution.&#160;This&#160;depends&#160;on&#160;`!override`,&#160;which&#160;needs&#160;Docker&#160;Compose&#160;2.24.4&#160;or&#160;later;&#160;older&#160;versions&#160;refuse&#160;the&#160;file.</text>
