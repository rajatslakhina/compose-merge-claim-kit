<text x="750.0" y="30" fill="#e2e8f0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold">swift&#160;run&#160;ComposeMergeClaimDemo&#160;(real&#160;output,&#160;51&#160;lines)</text>
<text x="20" y="58" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">ComposeMergeClaimKit&#160;demo:&#160;what&#160;an&#160;answer&#160;says&#160;about&#160;merged&#160;compose&#160;files,&#160;checked&#160;with&#160;compose's&#160;rules</text>
<text x="20" y="73" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="88" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">1.&#160;A&#160;correct&#160;answer&#160;about&#160;the&#160;merged&#160;result</text>
<text x="20" y="103" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;verified:&#160;5&#160;claims&#160;checked,&#160;5&#160;hold</text>
<text x="20" y="118" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;rule:&#160;commandReplaced:&#160;holds.&#160;This&#160;holds.</text>
<text x="20" y="133" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`web`&#160;runs&#160;`npm&#160;run&#160;dev`:&#160;holds.&#160;This&#160;holds.</text>
<text x="20" y="148" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`web`&#160;publishes&#160;ports&#160;`8080`&#160;and&#160;`8081`:&#160;holds.&#160;This&#160;holds.</text>
<text x="20" y="163" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;rule:&#160;mappingsMergeByKey:&#160;holds.&#160;This&#160;holds.</text>
<text x="20" y="178" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`LOG_LEVEL`&#160;is&#160;`info`&#160;in&#160;`web`:&#160;holds.&#160;This&#160;holds.</text>
<text x="20" y="193" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="208" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">2.&#160;A&#160;later&#160;file's&#160;ports&#160;read&#160;as&#160;replacing&#160;the&#160;base&#160;ones</text>
<text x="20" y="223" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;wrong:&#160;1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong</text>
<text x="20" y="238" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`web`&#160;publishes&#160;port&#160;`8081`,&#160;not&#160;port&#160;`8080`:&#160;wrong&#160;(listReplaced).&#160;With&#160;these&#160;files,&#160;`web`&#160;publishes&#160;ports&#160;`8080`&#160;and&#160;`8081`.&#160;A&#160;later&#160;file's&#160;lists&#160;are&#160;appended&#160;to&#160;the&#160;earlier&#160;ones&#160;(`ports`&#160;and&#160;`volumes`</text>
<text x="20" y="253" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;merge&#160;items&#160;with&#160;the&#160;same&#160;key);&#160;tag&#160;the&#160;list&#160;`!override`&#160;to&#160;replace&#160;it.</text>
<text x="20" y="268" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="283" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">3.&#160;The&#160;environment&#160;block&#160;read&#160;as&#160;replaced&#160;whole</text>
<text x="20" y="298" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;wrong:&#160;2&#160;claims&#160;checked,&#160;1&#160;hold,&#160;1&#160;wrong</text>
<text x="20" y="313" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`DEBUG`&#160;is&#160;`1`&#160;in&#160;`web`:&#160;holds.&#160;This&#160;holds.</text>
<text x="20" y="328" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`LOG_LEVEL`&#160;is&#160;not&#160;set&#160;in&#160;`web`:&#160;wrong&#160;(mappingReplaced).&#160;With&#160;these&#160;files,&#160;`LOG_LEVEL`&#160;is&#160;`info`&#160;in&#160;`web`.&#160;A&#160;later&#160;file's&#160;`environment`&#160;and&#160;`labels`&#160;are&#160;merged&#160;key&#160;by&#160;key:&#160;the&#160;earlier&#160;keys&#160;stay&#160;unless</text>
<text x="20" y="343" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;the&#160;later&#160;file&#160;sets&#160;them&#160;or&#160;`!reset`s&#160;them.</text>
<text x="20" y="358" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="373" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">4.&#160;An&#160;empty&#160;list&#160;read&#160;as&#160;clearing&#160;(one&#160;mistake,&#160;one&#160;finding)</text>
<text x="20" y="388" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;wrong:&#160;1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong</text>
<text x="20" y="403" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;rule&#160;broken:&#160;emptyListKeeps:&#160;wrong&#160;(emptyListClears).&#160;An&#160;empty&#160;list&#160;in&#160;a&#160;later&#160;file&#160;adds&#160;nothing,&#160;so&#160;the&#160;earlier&#160;items&#160;stay;&#160;write&#160;`!reset&#160;[]`&#160;to&#160;clear&#160;them.</text>
<text x="20" y="418" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;[files&#160;alone]&#160;wrong:&#160;1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong</text>
<text x="20" y="433" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`ports:&#160;[]`&#160;in&#160;`docker-compose.override.yml`&#160;clears&#160;`web`'s&#160;`ports`:&#160;wrong&#160;(emptyListClears).&#160;`ports:&#160;[]`&#160;in&#160;`docker-compose.override.yml`&#160;adds&#160;nothing,&#160;so&#160;`web`&#160;keeps&#160;the&#160;earlier&#160;`ports`;&#160;write&#160;`ports:</text>
<text x="20" y="448" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;!reset&#160;[]`&#160;to&#160;clear&#160;them.</text>
<text x="20" y="463" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
<text x="20" y="478" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">5.&#160;The&#160;override&#160;read&#160;as&#160;still&#160;applying&#160;with&#160;-f</text>
<text x="20" y="493" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;wrong:&#160;1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong</text>
<text x="20" y="508" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;-&#160;`web`&#160;runs&#160;`myapp:dev`:&#160;wrong&#160;(overrideLoadedWithFile).&#160;With&#160;these&#160;files,&#160;`web`&#160;runs&#160;`myapp:1.0`.&#160;With&#160;`-f`,&#160;compose&#160;reads&#160;only&#160;the&#160;files&#160;named:&#160;the&#160;override&#160;file&#160;is&#160;read&#160;only&#160;when&#160;a&#160;`-f`&#160;names&#160;it.</text>
<text x="20" y="523" fill="#cbd5e1" font-family="Menlo, Monaco, monospace" font-size="10.5" text-anchor="start" font-weight="normal"></text>
